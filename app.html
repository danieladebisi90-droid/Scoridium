<!doctype html>
<html lang="en">
<head>
  <!-- Installable Scoridium app (iOS, Android, desktop) -->
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
  <meta name="theme-color" content="#10233F">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Scoridium">

  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Scoridium</title>
  <script src="team-theme-boot.js"></script>
  <link rel="stylesheet" href="pageLayout.css">
  <link rel="stylesheet" href="app-shell.css">
  <link rel="stylesheet" href="release-ui.css?v=1">
  <script src="https://unpkg.com/lucide@latest" defer></script>
  <link rel="stylesheet" href="universal-ui.css?v=1">
</head>
<body class="scoridium-shell">
  <header id="app-header" class="shell-header">
    <nav id="main-navigation" aria-label="Main navigation">
      <a href="myTeams.html" class="nav-home" title="My Teams" aria-label="Go to My Teams">SCORIDIUM</a>
      <span class="nav-divider"></span>
      <div class="header-team"><h2 id="shared-team-name"></h2></div>
      <span class="nav-divider"></span>
      <div class="nav-links">
        <a href="dashboard.html" data-view="dashboard.html">Dashboard</a>
        <a href="gamehub.html" data-view="gamehub.html">Game Hub</a>
        <a href="roster.html" data-view="roster.html">Roster</a>
        <a href="stats.html" data-view="stats.html">Stats</a>

      </div>
      <span class="nav-divider"></span>
      <div class="season-selector-container"><select class="season-selector" aria-label="Select season"><option>Season</option></select></div>
    </nav>
  </header>
  <div class="mobile-app-topbar" aria-label="Team header">
    <a class="mobile-brand" href="myTeams.html" aria-label="My Teams">SCORIDIUM<span>.</span></a>
    <span class="mobile-team-name" id="mobile-team-name">MY TEAM</span>
    <button type="button" class="mobile-team-menu-btn" id="mobile-team-menu-btn" aria-label="More options" aria-expanded="false">•••</button>
  </div>
  <div class="mobile-more-menu" id="mobile-more-menu" hidden>
    <a href="myTeams.html">Switch Team</a>

  </div>
  <main class="shell-main" id="shell-main" aria-label="Scoridium page">
    <iframe id="page-frame" title="Scoridium content" loading="eager" allow="fullscreen" referrerpolicy="same-origin"></iframe>
    <div class="shell-loading" id="shell-loading" aria-hidden="true"><span class="shell-loading-line"></span></div>
  </main>
  <nav class="mobile-bottom-nav" aria-label="Mobile navigation">
    <a href="dashboard.html" data-view="dashboard.html"><span class="mobile-nav-icon">⌂</span><span>Home</span></a>
    <a href="gamehub.html" data-view="gamehub.html"><span class="mobile-nav-icon">▦</span><span>Games</span></a>
    <a href="roster.html" data-view="roster.html"><span class="mobile-nav-icon">♙</span><span>Roster</span></a>
    <a href="stats.html" data-view="stats.html"><span class="mobile-nav-icon">▥</span><span>Stats</span></a>

  </nav>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="team-theme.js"></script>
  <script src="app-shell.js"></script>
  <script src="./pwa-register.js" defer></script>
</body>
</html>
