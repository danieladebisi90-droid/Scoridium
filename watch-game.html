<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10233f"><title>Watch Game · Scoridium</title><link rel="stylesheet" href="revision43.css?v=2"><style>body{margin:0;background:#f2f5fa;color:#12345b}header{background:#10233f;color:#fff;padding:18px;display:flex;justify-content:space-between;align-items:center}a{color:inherit}.wrap{max-width:900px;margin:26px auto;padding:15px}.watch-card{border:1px solid #d6e0eb;border-radius:16px;background:#fff;padding:25px}.watch-score{display:flex;align-items:center;justify-content:space-around;text-align:center;gap:15px}.watch-score strong{font-size:clamp(38px,8vw,84px);font-variant-numeric:tabular-nums}.watch-score span{display:block;margin-top:8px}.watch-status{margin:18px 0;text-align:center;font-weight:700}.watch-note{text-align:center;color:#64748b}</style><link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap">
</head><body><header><strong>SCORIDIUM · WATCH</strong><a href="gamehub.html">Back to Games</a></header><main class="wrap"><div class="watch-card"><div class="watch-score"><div><strong id="watch-home">—</strong><span id="watch-team">Tracked Team</span></div><div><strong id="watch-away">—</strong><span id="watch-opponent">Opponent</span></div></div><p class="watch-status" id="watch-status">Loading game…</p><p class="watch-note">Read-only game scoreboard · refreshed while this page is open</p></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>
(async()=>{const id=new URLSearchParams(location.search).get('gameId');const text=(x,v)=>document.getElementById(x).textContent=v;if(!id){text('watch-status','No game selected');return;}async function refresh(){if(document.hidden)return;try{const {data,error}=await supabaseClient.from('games').select('id,opponent,team_score,opponent_score,status').eq('id',id).single();if(error)throw error;text('watch-home',data.team_score??'0');text('watch-away',data.opponent_score??'0');text('watch-opponent',data.opponent||'Opponent');text('watch-status',String(data.status||'Game').toUpperCase());}catch(e){text('watch-status','Game unavailable or viewing access not granted');}}await refresh();const tick=setInterval(refresh,5000);window.addEventListener('pagehide',()=>clearInterval(tick),{once:true});})();
</script></body></html>
