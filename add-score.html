<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Submit Game Score · ApexVision</title><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="film-analysis.css"><link rel="stylesheet" href="add-score.css"></head>
<body><main class="film-shell"><header><a href="gamehub.html" class="film-back">← Game Hub</a><span class="film-brand">APEXVISION</span></header>
<h1>Submit Game Score</h1><p>Parents and team members can submit results for review. Only a coach or manager can approve a result as official. Score-only games do not create player statistics.</p>
<form id="score-form"><label>Game<select id="score-game" required><option value="">Loading…</option></select></label><fieldset><legend>Entry method</legend><label><input type="radio" name="entry" value="final" checked> Final score only</label><label><input type="radio" name="entry" value="quarters"> By quarter</label></fieldset>
<div id="score-final"><label>Our final score<input id="score-us" type="number" min="0" max="500" required></label><label>Opponent final score<input id="score-them" type="number" min="0" max="500" required></label></div><div id="score-quarters" hidden></div><p id="score-sum" class="film-note" hidden></p><button type="submit" class="film-save">Submit for review</button></form>
<div id="score-status" class="film-alert" role="status" aria-live="polite"></div><section id="score-reviews" hidden><h2>Pending score approvals</h2><div id="score-review-list"></div></section>
</main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="add-score.js" defer></script></body></html>
